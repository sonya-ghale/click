{% load static %}
<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ layout.title }} — Photo Booth</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="{% static 'gallery/js/tailwind-config.js' %}"></script>
  <link href="{% static 'gallery/css/booth.css' %}" rel="stylesheet" />
</head>
<body
  id="editorRoot"
  class="bg-[#f6f5f0] text-on-background font-body h-screen flex flex-col items-center px-4 md:px-8 pt-16 pb-6 overflow-x-hidden"
  data-layout-key="{{ layout.key }}"
  data-layout-title="{{ layout.title }}"
  data-slot-count="{{ layout.slots }}"
  data-pad="{{ layout.pad }}"
  data-gap="{{ layout.gap }}"
  data-cols="{{ layout.cols }}"
  data-rows="{{ layout.rows }}"
>
  <canvas id="captureCanvas" class="hidden"></canvas>
  <canvas id="compositeCanvas" class="hidden"></canvas>
  <div id="videoParking" class="hidden">
    <video id="boothVideo" class="mirrored" playsinline muted autoplay></video>
  </div>

  <div class="fixed top-5 left-5 z-30 flex items-center gap-3">
    <a
      href="{% url 'gallery:frames' %}"
      class="flex items-center gap-1.5 pl-2 pr-3.5 py-1.5 rounded-full bg-white border border-black/5 shadow-sm font-label text-[11px] font-bold text-on-surface hover:bg-surface-container-low transition"
      title="Back to layouts"
    >
      <span class="material-symbols-outlined text-base">arrow_back</span>
      Back
    </a>
    <div class="hidden sm:flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-[#ecebe4] border border-black/5 font-label text-[10px] font-bold uppercase tracking-wider text-on-surface/70">
      <span id="camDot" class="w-1.5 h-1.5 rounded-full bg-outline-variant"></span>
      <span id="camStatus">Cam 01 Off</span>
      <span class="text-on-surface/30">|</span>
      <span id="slotStatus">Slot 1 / {{ layout.slots }} Active</span>
    </div>
  </div>

  <label class="fixed top-5 right-5 z-30 flex items-center gap-2 pl-3 pr-2 py-1.5 rounded-full bg-white border border-black/5 shadow-sm font-label text-[11px] font-bold text-on-surface cursor-pointer">
    <span class="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
    <select id="layoutSelect" class="appearance-none bg-transparent bg-none border-0 p-0 pr-5 text-[11px] font-bold focus:ring-0 cursor-pointer">
      {% for l in layouts %}
        <option value="{{ l.key }}" {% if l.key == layout.key %}selected{% endif %}>{{ l.title }} Layout</option>
      {% endfor %}
    </select>
    <span class="material-symbols-outlined text-base -ml-5 pointer-events-none text-on-surface/50">expand_more</span>
  </label>

  <main class="w-full max-w-7xl flex-1 min-h-0 flex flex-col items-center gap-6">
    <div class="booth-bezel w-full flex-1 min-h-[360px] rounded-[2.5rem] bg-[#0b0b0b] p-5 md:p-7 flex flex-col gap-4 relative">
      <div class="flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
          <span class="px-3.5 py-1.5 rounded-full bg-white/[0.06] border border-white/10 text-white font-headline text-xs font-bold">{{ layout.title }}</span>
          <span id="liveChip" class="flex items-center gap-1.5 px-2 py-1 rounded-full text-white/40 font-label text-[9px] font-bold uppercase tracking-wider">
            <span id="liveDot" class="w-1.5 h-1.5 rounded-full bg-white/30"></span>
            <span id="liveText">Idle</span>
          </span>
        </div>
        <div class="flex items-center gap-2">
          <a
            href="{% url 'gallery:frames' %}"
            class="w-8 h-8 rounded-full bg-white/[0.06] border border-white/10 text-white flex items-center justify-center hover:bg-white/15 transition"
            title="Back to layouts"
          >
            <span class="material-symbols-outlined text-lg">arrow_back</span>
          </a>
          <button type="button" id="gridHintBtn" class="w-8 h-8 rounded-full bg-white/[0.06] border border-white/10 text-white flex items-center justify-center hover:bg-white/15 transition" title="Layout info">
            <span class="material-symbols-outlined text-lg">grid_view</span>
          </button>
        </div>
      </div>

      <div class="flex-1 min-h-0 relative">
        {% include layout.template %}

        <div id="countdownOverlay" class="hidden absolute inset-0 z-20 bg-black/70 rounded-xl flex items-center justify-center">
          <div
            id="countdownNumber"
            class="bg-primary text-white font-headline text-6xl md:text-7xl font-black w-28 h-28 md:w-32 md:h-32 flex items-center justify-center rounded-full shadow-[0px_8px_0px_#570037] border-4 border-white"
          >3</div>
        </div>
      </div>

      <div class="flex justify-end gap-2 shrink-0 pointer-events-none">
        <span class="px-3 py-1 rounded-lg border border-white/15 text-white/70 font-mono text-[9px] font-bold uppercase tracking-widest">ISO 200</span>
        <span class="px-3 py-1 rounded-lg border border-white/15 text-white/70 font-mono text-[9px] font-bold uppercase tracking-widest">HD</span>
      </div>
    </div>

    <div class="shrink-0 flex flex-wrap items-center justify-center gap-6 sm:gap-8 pt-2">
      <button
        type="button"
        id="resetBtn"
        class="w-11 h-11 rounded-full bg-[#ece6b4] text-on-surface flex items-center justify-center hover:scale-110 active:scale-95 transition shadow-[0_4px_0_#c0bb8a]"
        title="Clear all"
      >
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
      <button
        type="button"
        id="shutterBtn"
        class="w-16 h-16 rounded-full bg-[#e56a9a] ring-4 ring-[#4a0f2c] ring-offset-4 ring-offset-[#f6d9e5] flex items-center justify-center shadow-lg hover:brightness-105 active:scale-95 transition disabled:opacity-40 disabled:cursor-not-allowed"
        title="Capture to active slot"
      >
        <span class="material-symbols-outlined text-white text-3xl">photo_camera</span>
      </button>
      <button
        type="button"
        id="switchCameraBtn"
        class="w-11 h-11 rounded-full bg-[#ece6b4] text-on-surface flex items-center justify-center hover:scale-110 active:scale-95 transition shadow-[0_4px_0_#c0bb8a]"
        title="Switch camera"
      >
        <span class="material-symbols-outlined text-xl">cached</span>
      </button>

      <div id="timerPicker" class="flex items-center gap-1 p-1 rounded-full bg-white border border-black/5 shadow-sm" role="group" aria-label="Countdown timer">
  <span class="material-symbols-outlined text-base text-on-surface/50 pl-2">timer</span>
  <button type="button" class="timer-preset px-3 py-1.5 rounded-full font-label text-xs font-bold transition" data-seconds="0">Off</button>
  <button type="button" class="timer-preset px-3 py-1.5 rounded-full font-label text-xs font-bold transition" data-seconds="3">3s</button>
  <button type="button" class="timer-preset px-3 py-1.5 rounded-full font-label text-xs font-bold transition" data-seconds="5">5s</button>
  <button type="button" class="timer-preset px-3 py-1.5 rounded-full font-label text-xs font-bold transition" data-seconds="10">10s</button>
  <input
    id="timerCustom"
    type="number"
    min="1"
    max="60"
    inputmode="numeric"
    placeholder="Custom"
    class="w-20 h-8 px-2 rounded-full border-0 bg-surface-container-low font-label text-xs font-bold text-center focus:ring-2 focus:ring-primary"
    aria-label="Custom countdown in seconds"
  />
</div>

      <span class="hidden sm:block w-px h-10 bg-on-surface/10"></span>

      <div class="flex items-center gap-3">
        <button
          type="button"
          id="previewBtn"
          disabled
          class="h-12 pl-4 pr-5 rounded-full bg-white border border-black/5 text-on-surface font-headline font-bold text-sm flex items-center gap-2 shadow-[0_4px_0_#e2dfd0] hover:bg-surface-container-low active:translate-y-0.5 active:shadow-[0_2px_0_#e2dfd0] transition disabled:opacity-50 disabled:cursor-not-allowed disabled:active:translate-y-0"
          title="Preview before downloading"
        >
          <span class="material-symbols-outlined text-xl">visibility</span>
          Preview
        </button>
        <button
          type="button"
          id="downloadBtn"
          disabled
          class="h-12 pl-4 pr-5 rounded-full bg-secondary text-white font-headline font-bold text-sm flex items-center gap-2 shadow-[0_4px_0_#1c5d3b] hover:brightness-110 active:translate-y-0.5 active:shadow-[0_2px_0_#1c5d3b] transition disabled:bg-[#c9c6b3] disabled:shadow-[0_4px_0_#a8a590] disabled:cursor-not-allowed disabled:active:translate-y-0"
          title="Download your photo"
        >
          <span class="material-symbols-outlined text-xl">download</span>
          <span id="downloadLabel">Download</span>
        </button>
        <button
          type="button"
          id="shareBtn"
          class="w-12 h-12 rounded-full bg-white border border-black/5 text-tertiary flex items-center justify-center shadow-[0_4px_0_#e2dfd0] hover:scale-105 transition"
          title="Share"
        >
          <span class="material-symbols-outlined text-xl">share</span>
        </button>
      </div>
    </div>
  </main>

  {% include "frame/_modals.html" %}

  <script type="module" src="{% static 'gallery/js/booth.js' %}"></script>
</body>
</html>
