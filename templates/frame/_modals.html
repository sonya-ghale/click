<div id="previewModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="w-full max-w-4xl max-h-full bg-white rounded-3xl shadow-2xl p-5 md:p-6 flex flex-col gap-4">
    <div class="flex items-center justify-between gap-4 shrink-0">
      <div>
        <h2 class="font-headline font-extrabold text-xl text-on-surface">Preview</h2>
        <p class="font-label text-xs text-on-surface-variant mt-0.5">This is exactly how your download will look.</p>
      </div>
      <button type="button" id="previewClose" class="w-9 h-9 rounded-full bg-surface-container-low text-on-surface flex items-center justify-center hover:bg-surface-container transition" title="Close">
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>

    <div class="flex flex-wrap gap-2 shrink-0" role="group" aria-label="Download size">
      {% for size in download_sizes %}
        <button
          type="button"
          class="preview-size px-3.5 py-2 rounded-full border-2 border-surface-container-highest font-label text-xs font-bold text-on-surface-variant hover:border-primary/50 transition"
          data-size-key="{{ size.key }}"
          data-width="{{ size.width }}"
          data-height="{{ size.height }}"
        >
          {{ size.title }}
          <span class="font-mono font-normal opacity-60 ml-1">{{ size.width }}×{{ size.height }}</span>
        </button>
      {% endfor %}
    </div>

    <div class="flex-1 min-h-0 rounded-2xl bg-[#f6f5f0] border border-black/5 flex items-center justify-center p-4 overflow-hidden">
      <img id="previewImage" alt="Preview of your photo layout" class="max-w-full max-h-[60vh] object-contain rounded-md shadow-lg" />
      <p id="previewLoading" class="font-label text-xs text-on-surface-variant">Rendering…</p>
    </div>

    <div class="flex justify-end gap-3 shrink-0">
      <button type="button" id="previewCancel" class="h-11 px-5 rounded-full bg-surface-container-low text-on-surface font-headline font-bold text-sm hover:bg-surface-container transition">
        Keep editing
      </button>
      <button type="button" id="previewDownload" class="h-11 pl-4 pr-5 rounded-full bg-secondary text-white font-headline font-bold text-sm flex items-center gap-2 shadow-[0_4px_0_#1c5d3b] hover:brightness-110 transition">
        <span class="material-symbols-outlined text-xl">download</span>
        Download this size
      </button>
    </div>
  </div>
</div>

<div id="sizeModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="w-full max-w-lg bg-white rounded-3xl shadow-2xl p-6 md:p-7">
    <div class="flex items-start justify-between gap-4 mb-5">
      <div>
        <h2 class="font-headline font-extrabold text-xl text-on-surface">Save your photo</h2>
        <p class="font-label text-xs text-on-surface-variant mt-1">Pick the booth size to download in.</p>
      </div>
      <button type="button" id="sizeModalClose" class="w-9 h-9 rounded-full bg-surface-container-low text-on-surface flex items-center justify-center hover:bg-surface-container transition" title="Close">
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>
    <div class="flex flex-col gap-3">
      {% for size in download_sizes %}
        <button
          type="button"
          class="size-option group flex items-center gap-4 text-left p-4 rounded-2xl border-2 border-surface-container-highest hover:border-primary hover:bg-primary/5 transition"
          data-size-key="{{ size.key }}"
          data-width="{{ size.width }}"
          data-height="{{ size.height }}"
        >
          <span class="shrink-0 w-12 h-12 rounded-xl bg-surface-container-low text-primary flex items-center justify-center group-hover:bg-primary group-hover:text-white transition">
            <span class="material-symbols-outlined">{{ size.icon }}</span>
          </span>
          <span class="flex-1 min-w-0">
            <span class="block font-headline font-bold text-sm text-on-surface">{{ forloop.counter }}. {{ size.title }}</span>
            <span class="block font-label text-[11px] text-on-surface-variant mt-0.5">{{ size.dimensions }}</span>
            <span class="block font-label text-[11px] text-on-surface-variant/70 mt-0.5">{{ size.best_for }}</span>
          </span>
          <span class="shrink-0 font-mono text-[10px] text-on-surface-variant/70">{{ size.width }}×{{ size.height }}</span>
        </button>
      {% endfor %}
    </div>
  </div>
</div>
