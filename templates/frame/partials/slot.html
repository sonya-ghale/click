{# Reusable photo slot. Expects: index, cell_class #}
<div
  class="frame-cell relative rounded-xl transition-shadow {{ cell_class }}"
  data-slot-index="{{ index }}"
>
  <input class="hidden image-input" type="file" accept="image/*" />
  <div
    class="frame-slot w-full h-full rounded-xl overflow-hidden border-2 border-dashed border-outline-variant bg-surface-container-low relative cursor-pointer select-none touch-manipulation min-h-[100px]"
  ></div>
  <button
    type="button"
    class="upload-btn absolute bottom-2 right-2 z-10 w-9 h-9 rounded-full bg-white/90 shadow-md border border-outline-variant/40 flex items-center justify-center hover:bg-white"
    title="Upload photo"
  >
    <span class="material-symbols-outlined text-on-surface text-xl">add_photo_alternate</span>
  </button>
</div>
