{# Camera slot inside the booth screen. Expects: index, total #}
<div
  class="frame-cell relative min-h-0 min-w-0 rounded-xl border border-dashed border-white/10 bg-white/[0.03] overflow-hidden cursor-pointer select-none touch-manipulation transition-colors"
  data-slot-index="{{ index }}"
>
  <input class="hidden image-input" type="file" accept="image/*" />
  <div class="frame-slot absolute inset-0"></div>

  <span class="corner top-2 left-2 border-t border-l"></span>
  <span class="corner top-2 right-2 border-t border-r"></span>
  <span class="corner bottom-2 left-2 border-b border-l"></span>
  <span class="corner bottom-2 right-2 border-b border-r"></span>

  <span class="slot-label absolute top-2.5 left-2.5 z-10 flex items-center gap-1 px-2 py-0.5 rounded-full font-label text-[9px] font-bold uppercase tracking-wider">
    <span class="slot-dot hidden w-1.5 h-1.5 rounded-full bg-white"></span>
    Slot {% if index < 9 %}0{% endif %}{{ index|add:1 }}
  </span>
  <span class="slot-status absolute top-3 right-3 z-10 font-mono text-[8px] font-bold uppercase tracking-widest text-white/40">Ready</span>
  <span class="slot-rec hidden absolute bottom-3 left-3 z-10 font-mono text-[8px] font-bold uppercase tracking-widest text-white/60">Rec ●</span>
  <span class="absolute bottom-3 right-3 z-10 font-mono text-[8px] text-white/40">{{ index|add:1 }}/{{ total }}</span>

  <button
    type="button"
    class="upload-btn absolute bottom-7 right-2.5 z-10 w-7 h-7 rounded-full bg-white/10 border border-white/20 text-white/70 flex items-center justify-center opacity-0 hover:bg-white/25 transition-opacity"
    title="Upload photo"
  >
    <span class="material-symbols-outlined text-base">add_photo_alternate</span>
  </button>
</div>
