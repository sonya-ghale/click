{# Solo Star — single portrait. Own pad/gap: see layout.pad / layout.gap #}
<div
  id="slotsContainer"
  class="flex flex-col bg-surface-container rounded-xl"
  style="gap: {{ layout.preview_gap }}px; padding: {{ layout.preview_pad }}px;"
>
  {% for i in layout.indexes %}
    {% include "frame/partials/slot.html" with index=forloop.counter0 cell_class="min-h-[200px] w-full" %}
  {% endfor %}
</div>
