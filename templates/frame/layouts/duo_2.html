{# Duo Story — 2 landscape frames stacked, same shape as the layout card #}
<div
  id="slotsContainer"
  class="grid grid-cols-1 grid-rows-2 h-full max-w-full mx-auto aspect-[3/4]"
  style="gap: {{ layout.gap }}px; padding: {{ layout.pad }}px;"
>
  {% for i in layout.indexes %}
    {% include "frame/partials/slot.html" with index=forloop.counter0 total=layout.slots %}
  {% endfor %}
</div>
