{# Gallery Mix — 6 frames in 2 columns × 3 rows, same shape as the layout card #}
<div
  id="slotsContainer"
  class="grid grid-cols-2 grid-rows-3 h-full max-w-full mx-auto aspect-[3/4]"
  style="gap: {{ layout.gap }}px; padding: {{ layout.pad }}px;"
>
  {% for i in layout.indexes %}
    {% include "frame/partials/slot.html" with index=forloop.counter0 total=layout.slots %}
  {% endfor %}
</div>
