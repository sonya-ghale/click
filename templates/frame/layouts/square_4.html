{# Square 2x2 — 4 frames in a grid. Own pad/gap: see layout.pad / layout.gap #}
<div
  id="slotsContainer"
  class="grid grid-cols-2 bg-surface-container rounded-xl"
  style="gap: {{ layout.preview_gap }}px; padding: {{ layout.preview_pad }}px;"
>
  {% for i in layout.indexes %}
    {% include "frame/partials/slot.html" with index=forloop.counter0 cell_class="aspect-square" %}
  {% endfor %}
</div>
